# Catalog site (site/): checks, build, browser tests and deploy to GitHub Pages.
# Kept apart from any marketplace or harness checks: every job here is
# shown as "Site / <job>", so its result shows up on its own line in the PR checks and the Actions UI.
name: Site

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
      - '.claude-plugin/**'
      - 'site/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'plugins/**'
      - '.claude-plugin/**'
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  schedule:
    # Daily: refreshes the "New"/"Updated" badges and the GitHub numbers on /stats/.
    - cron: '17 5 * * *'

permissions:
  contents: read

concurrency:
  # One run per branch; a newer push to a PR cancels the older run. main always finishes.
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      - name: Typecheck
        working-directory: site
        run: npm run typecheck

      - name: Test
        working-directory: site
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git history feeds updatedAt and the What's new feed

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      # `claude plugin validate` needs no login; it feeds the validation badges (spec 5.4).
      # If the install fails, the build still runs and the badges read "Not verified".
      - name: Install Claude Code CLI
        continue-on-error: true
        run: npm install --global @anthropic-ai/claude-code@2.1.301

      # astro build, then the CSP <meta> with inline-script hashes, the fixture-leak check and the
      # size budgets (spec 13; the table goes to the job summary).
      - name: Build
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # public GitHub data for /stats/ only, never written to the output
        run: npm run build

      - name: Check links
        working-directory: site
        run: npm run check:links

      - name: Summary
        working-directory: site
        run: |
          {
            echo "### Site build"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Pages | $(find dist -name index.html | wc -l) |"
            echo "| Plugins | $(node -e "console.log(require('./dist/api/catalog.json').artifacts.filter(a=>a.type==='plugin').length)") |"
            echo "| Components | $(node -e "console.log(require('./dist/api/catalog.json').artifacts.filter(a=>a.type!=='plugin').length)") |"
            echo "| Size | $(du -sh dist | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist
          include-hidden-files: true # keeps .nojekyll

  browser-tests:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the real build below reads git history too

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      # Browser smoke tests (spec 14) run on dist/ and on dist-e2e/, a build of the test fixture
      # with artifacts and releases. Nothing is uploaded from this job; the "Build" job publishes.
      - name: Build sites under test
        working-directory: site
        env:
          DD_VALIDATE: '0' # validation badges are not under test here
          DD_SKIP_GITHUB: '1'
        run: npm run build && npm run build:e2e && node scripts/check-links.mjs dist-e2e

      - name: Install Chromium for Playwright
        working-directory: site
        run: npx playwright install --with-deps chromium

      - name: Browser tests (Playwright + axe-core)
        working-directory: site
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            site/playwright-report
            site/test-results
          retention-days: 7

  deploy:
    name: Deploy to Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [checks, build, browser-tests]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
