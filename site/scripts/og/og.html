<!doctype html>
<!-- Source of public/og.png (spec 7.9). Regenerate with `npm run og:update`. Colors are the light tokens from src/styles/tokens.css. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    color: #1b1f24;
    background: #ffffff;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 72px 80px 64px;
    border-top: 12px solid #0b5cad;
  }
  .brand { display: flex; align-items: center; gap: 20px; font-size: 26px; color: #57606a; font-weight: 600; }
  .brand svg { width: 64px; height: 64px; }
  h1 { font-size: 76px; line-height: 1.05; letter-spacing: -1.5px; font-weight: 700; margin-top: 36px; }
  p { font-size: 32px; line-height: 1.35; color: #57606a; margin-top: 20px; max-width: 980px; }
  .types { display: flex; gap: 12px; flex-wrap: wrap; }
  .t { font-size: 24px; font-weight: 600; padding: 8px 18px; border-radius: 999px; }
  .cmd {
    font-family: "Cascadia Code", "JetBrains Mono", Consolas, ui-monospace, monospace;
    font-size: 26px; color: #1b1f24; background: #f6f7f9; border: 1px solid #d9dde3;
    border-radius: 10px; padding: 16px 22px; margin-top: 28px; display: inline-block;
  }
</style>
</head>
<body>
  <div>
    <div class="brand">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect width="16" height="16" rx="3" fill="#0b5cad"/><path d="M2.5 4.75 8 2l5.5 2.75v6.5L8 14l-5.5-2.75zM2.5 4.75 8 7.5l5.5-2.75M8 7.5V14" fill="none" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/></svg>
      <span>Plugin catalog for Claude Code</span>
    </div>
    <h1>DevDigest Marketplace</h1>
    <p>Skills, agents, commands, hooks and MCP servers for DevDigest, the local-first AI PR reviewer.</p>
  </div>
  <div>
    <div class="types">
      <span class="t" style="color:#0b6e4f;background:#e2efeb">Skills</span>
      <span class="t" style="color:#8a4b00;background:#f1e9e0">Agents</span>
      <span class="t" style="color:#0a6877;background:#e2edef">Commands</span>
      <span class="t" style="color:#a40e26;background:#f4e2e5">Hooks</span>
      <span class="t" style="color:#3d4b5c;background:#e8eaed">MCP servers</span>
    </div>
    <div class="cmd">/plugin marketplace add DmytrivDev/DevDigest-AI-Marketplace</div>
  </div>
</body>
</html>
